    Research Experience:
      - label: Research Assistant
        details: "**Rice University** · May 2025–present


          Advisor: Prof. Santiago Segarra


          - Developed Prior-Informed Flow Matching (PIFM), a rectified-flow generative framework for missing-edge graph reconstruction conditioned on structural
          priors.

          - Developed and maintained a PyTorch codebase and evaluated link-prediction performance and graph-distribution metrics against baseline methods.

          - Led experiments, analysis, figure preparation, and writing for a first-author paper accepted at the ICML 2026 SPIGM Workshop.

          - Developing a constraint-aware version of PIFM using primal-dual guidance during inference."
      - label: Undergraduate Researcher, Trust & Responsibility Summer Research Program
        details: "**Rice University** · May 2026–present


          Advisor: Prof. César A. Uribe


          - Developing an occupation translator using task representations, clustering, and fused Gromov-Wasserstein comparisons to align occupational taxonomies.

          - Built an extraction and embedding pipeline for O*NET releases and ESCO/ISCO taxonomies to examine splits, merges, task reorganization, and ambiguous
          matches."
